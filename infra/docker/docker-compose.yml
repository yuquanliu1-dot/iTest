services:
  postgres:
    image: postgres:16-alpine
    container_name: itest-pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: itest
      POSTGRES_PASSWORD: itest
      POSTGRES_DB: itest
    volumes:
      - itest-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U itest"]
      interval: 2s
      timeout: 5s
      retries: 30

  redis:
    image: redis:7-alpine
    container_name: itest-redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 5s
      retries: 30

  api:
    image: itest-api:latest
    mem_limit: 4g
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env.production
    environment:
      - PI_DATA_DIR=/repo/apps/api/.data
      - EXEC_CONCURRENCY=${EXEC_CONCURRENCY:-3}
      - GAUSS_BRIDGE_URL=http://gauss-bridge:8080
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:54321/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    # api does not map host ports: the only entry is the nginx reverse proxy (http://api:54321 internal DNS round-robin); fixed ports would inevitably conflict with multiple replicas
    volumes:
      - itest-data:/repo/apps/api/.data
      - itest-screenshots:/repo/apps/api/screenshots

  web:
    image: itest-web:latest
    container_name: itest-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:80/ | grep -q 'iTest\\|<div id=\"root\"'"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    ports:
      - "8080:80"

  # GaussDB 100 JDBC bridge: gauss100's proprietary wire protocol has no Node driver; SQL is forwarded over HTTP to the Huawei JDBC inside the bridge.
  # No host port mapping (internal-network api only); api does not depends_on the bridge — a dead bridge only breaks gauss100 connectivity, it does not drag api down
  # (api-side lazy failure: the query call errors out the first time it finds the bridge unreachable; other database types are unaffected).
  # Token auth is off by default (internal network only); if needed, add GAUSS_BRIDGE_TOKEN to .env.production and give the bridge a variable of the same name.
  gauss-bridge:
    image: itest-gauss-bridge:latest
    container_name: itest-gauss-bridge
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  itest-pg-data:
  itest-data:
  itest-screenshots: