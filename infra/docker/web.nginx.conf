# AI 助手(/api/assistant)粘性 upstream。助手线程的 session 是进程内内存态
# (apps/api/src/pi/space/session.ts records Map + AgentSession),SSE 长连接与消息 POST
# 必须打到同一副本,否则回复事件只发到扛住 POST 的副本 listeners,前端挂着的 SSE 在别的
# 副本 → 消息入库但零回复。zone + server resolve 让 nginx 跟随 Docker DNS 动态刷新副本 IP
# 集(api 服务多副本轮流重建也不失效);ip_hash 按客户端 IP 固定落点 —— proxy_pass 的容器
# NAT 下外部客户端源 IP 收敛为网关 IP,等效「全部助手流量钉在单一副本」,恢复 P2 多副本
# 之前的单容器语义。代理设置与 /api/ 一致(SSE 关缓冲/长超时)。
# 只粘 /api/assistant:{exec / cancel / recorder / plan-run SSE 已是跨容器 redis,保持轮询}
resolver 127.0.0.11 valid=30s;

# 主访问日志：带上游落点/耗时/响应字节。live 画面断流（连接被掐、ip_hash 漂移）靠
# request_time 与 body_bytes_sent 定位；upstream_addr 能看出同一 key 的连续请求是否换副本。
log_format itest_main '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" rt=$request_time ua=$upstream_addr';

upstream assistant_api {
  zone assistant_api 64k;
  server api:54321 resolve;
  ip_hash;
}

server {
  listen 80;
  server_name _;
  client_max_body_size 60m;
  access_log /dev/stdout itest_main;

  # 前端 SPA
  location / {
    root /usr/share/nginx/html;
    index index.html;
    try_files $uri /index.html;
  }

  # AI 助手:粘性反代。proxy_next_upstream off:SSE 已挂连接被透明跳到另一副本会就地建一个
  # 碎片化 session(比断线更隐蔽),宁可把错误抛回给前端 EventSource,重连仍命中同一副本。
  location /api/assistant/ {
    proxy_pass http://assistant_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_read_timeout 86400s;
    proxy_send_timeout 86400s;
    proxy_next_upstream off;
  }

  # API 反代 / SSE 长连接
  # proxy_buffering off:SSE 事件流在 buffering on 下按块 flush(前端像卡死),关闭后
  # 每帧即时透传(API 侧另有 X-Accel-Buffering:no 精确关 SSE 响应的缓冲,两处互为兜底)。
  # 读/写超时拉到 24h:assistant verify_case 单步 AI 相可静默 240s、plan run 跨多用例更久,
  # 默认 300s 会在读侧静默时段掐断长连接(心跳注释帧保活 + 超时兜底,缺一不可)。
  location /api/ {
    proxy_pass http://api:54321/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_read_timeout 86400s;
    proxy_send_timeout 86400s;
  }

  # API 静态资源（截图）
  # 注意：API 生成的就是 /screenshots/<reportId>/<file>.png（vite dev 时代 /screenshots 也直接走 api），
  # 不能只重写 /static/ —— 浏览器拿 <img src="/screenshots/..."> 命中通用 location 会被 SPA 兜底成 HTML。
  location /screenshots/ {
    proxy_pass http://api:54321;
    proxy_set_header Host $host;
  }
  location /static/ {
    rewrite ^/static/(.*)$ /screenshots/$1 break;
    proxy_pass http://api:54321;
    proxy_set_header Host $host;
  }

  # 录制扩展 WebSocket。必须精确匹配(=)：REST 的 /api/recorder/sessions 要走上面的通用 /api/ 反代；
  # WS 握手路径是 /api/recorder，而 API 的 upgrade 处理器只认 /recorder(apps/api/src/recorder/ws.ts)，
  # 所以 proxy_pass 带 URI 把 /api/recorder 改写成 /recorder。
  location = /api/recorder {
    proxy_pass http://api:54321/recorder;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_read_timeout 86400s;
  }
}