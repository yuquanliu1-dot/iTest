server {
  listen 80;
  server_name _;
  client_max_body_size 60m;

  # 前端 SPA
  location / {
    root /usr/share/nginx/html;
    index index.html;
    try_files $uri /index.html;
  }

  # API 反代
  location /api/ {
    proxy_pass http://api:54321/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
  }

  # API 静态资源（截图）
  # 注意：API 生成的就是 /screenshots/<reportId>/<file>.png（vite dev 时代 /screenshots 也直接走 api），
  # 不能只重写 /static/ —— 浏览器拿 <img src="/screenshots/..."> 命中通用 location 会被 SPA 兜底成 HTML。
  location /screenshots/ {
    proxy_pass http://api:54321;
    proxy_set_header Host $host;
  }
  location /static/ {
    rewrite ^/static/(.*)$ /screenshots/$1 break;
    proxy_pass http://api:54321;
    proxy_set_header Host $host;
  }

  # 录制扩展 WebSocket。必须精确匹配(=)：REST 的 /api/recorder/sessions 要走上面的通用 /api/ 反代；
  # WS 握手路径是 /api/recorder，而 API 的 upgrade 处理器只认 /recorder(apps/api/src/recorder/ws.ts)，
  # 所以 proxy_pass 带 URI 把 /api/recorder 改写成 /recorder。
  location = /api/recorder {
    proxy_pass http://api:54321/recorder;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_read_timeout 86400s;
  }
}