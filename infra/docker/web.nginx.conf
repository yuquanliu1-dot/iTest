# Sticky upstream for the AI assistant (/api/assistant). An assistant thread's session is in-process memory state
# (apps/api/src/pi/space/session.ts records Map + AgentSession); SSE long connections and message POSTs
# must land on the same replica, otherwise reply events only reach the listeners of the replica that took the POST,
# while the frontend's SSE hangs on a different replica → message persisted but zero replies. zone + server resolve let nginx
# follow Docker DNS and refresh the replica IP set dynamically (survives api replicas being rebuilt in rotation); ip_hash pins
# landing by client IP — under the proxy_pass container NAT, external client source IPs collapse to the gateway IP,
# which effectively "pins all assistant traffic to a single replica", restoring the single-container semantics from
# before the P2 multi-replica work. Proxy settings match /api/ (SSE buffering off / long timeouts).
# Sticky only for /api/assistant: {exec / cancel / recorder / plan-run SSE already go through cross-container redis, keep round-robin}
resolver 127.0.0.11 valid=30s;

# Main access log: includes upstream landing / duration / response bytes. Live-view stream drops (connection cut, ip_hash drift)
# are diagnosed via request_time and body_bytes_sent; upstream_addr shows whether consecutive requests for the same key switched replicas.
log_format itest_main '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" rt=$request_time ua=$upstream_addr';

upstream assistant_api {
  zone assistant_api 64k;
  server api:54321 resolve;
  ip_hash;
}

server {
  listen 80;
  server_name _;
  client_max_body_size 60m;
  access_log /dev/stdout itest_main;

  # Frontend SPA
  location / {
    root /usr/share/nginx/html;
    index index.html;
    try_files $uri /index.html;
  }

  # AI assistant: sticky reverse proxy. proxy_next_upstream off: an already-open SSE connection being transparently
  # moved to another replica would silently create a fragmented session there (more insidious than a disconnect);
  # better to surface the error to the frontend EventSource — reconnects still land on the same replica.
  location /api/assistant/ {
    proxy_pass http://assistant_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_read_timeout 86400s;
    proxy_send_timeout 86400s;
    proxy_next_upstream off;
  }

  # API reverse proxy / SSE long connections
  # proxy_buffering off: with buffering on, the SSE event stream flushes in chunks (the frontend appears frozen);
  # off, every frame is passed through immediately (the API side also sets X-Accel-Buffering:no to precisely disable
  # buffering on SSE responses — the two guard each other).
  # Read/write timeouts stretched to 24h: an assistant verify_case step's AI phase can stay silent for 240s and a
  # plan run spans multiple cases for even longer; the default 300s would cut long connections during a silent read
  # window (heartbeat comment frames for keepalive + timeout fallback — both required).
  location /api/ {
    proxy_pass http://api:54321/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_read_timeout 86400s;
    proxy_send_timeout 86400s;
  }

  # API static assets (screenshots)
  # Note: the API itself emits /screenshots/<reportId>/<file>.png (in the vite dev era /screenshots also went straight to the api),
  # so rewriting only /static/ is not enough — an <img src="/screenshots/..."> hitting the generic location would fall through the SPA fallback into HTML.
  location /screenshots/ {
    proxy_pass http://api:54321;
    proxy_set_header Host $host;
  }
  location /static/ {
    rewrite ^/static/(.*)$ /screenshots/$1 break;
    proxy_pass http://api:54321;
    proxy_set_header Host $host;
  }

  # Recorder extension WebSocket. Must be an exact match (=): the REST /api/recorder/sessions goes through the generic /api/ proxy above;
  # the WS handshake path is /api/recorder, while the API's upgrade handler only accepts /recorder (apps/api/src/recorder/ws.ts),
  # so proxy_pass carries a URI to rewrite /api/recorder into /recorder.
  location = /api/recorder {
    proxy_pass http://api:54321/recorder;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_read_timeout 86400s;
  }
}