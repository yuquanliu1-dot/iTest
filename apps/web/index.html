<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>iTest</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Restore theme before first paint to avoid a light flash for dark-mode users (same storage key as stores/theme.ts)
      try {
        if (localStorage.getItem('itest-theme') === 'dark') {
          document.documentElement.classList.add('dark');
        }
      } catch (e) {}
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
