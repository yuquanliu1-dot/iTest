<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>iTest</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // 首帧前恢复主题，避免暗色用户看到亮色闪烁（与 stores/theme.ts 的存储键一致）
      try {
        if (localStorage.getItem('itest-theme') === 'dark') {
          document.documentElement.classList.add('dark');
        }
      } catch (e) {}
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
