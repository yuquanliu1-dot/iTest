<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div class="container">
      <div class="head">
        <span class="logo-dot"></span>
        <span class="name">iTest Recorder</span>
      </div>
      <p class="desc">__MSG_desc__</p>
      <div class="field">
        <label for="console-origin">__MSG_consoleOrigin__</label>
        <div class="row">
          <input id="console-origin" type="text" spellcheck="false" placeholder="http://localhost:5173" />
          <button id="save" class="btn">__MSG_save__</button>
        </div>
        <span id="save-status" class="status"></span>
      </div>
      <button id="open" class="btn primary">__MSG_openConsole__</button>
    </div>
    <script type="module" src="popup.js"></script>
  </body>
</html>
